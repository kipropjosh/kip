<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width= , initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="#" method="post" style="background-color: aqua;">Sign: center;">Student Registration Form</h1>
            </div>    
            <div class="form-row">
                <label>Name :</label>
                <input type="text" placeholder="Enter full name">
            </div>
            <div class="form-row">
                <label>Father's Name :</label>
                <input type="text">
            </div>
            <div class="form-row">
                <label>Mother's Name :</label>
                <input type="text">
            </div>
            <div class="form-row">
                <label>Phone Number :</label>
                <input type="tel" placeholder="+256xxxxxxxx">
            </div>
            <div class="form-row">
                <label>Email :</label>
                <input type="email" placeholder="sample@example.com">
            </div>
            <div class="form-row">
                <label>Gender :</label>
                <div class="gender">
                    <input type="radio" name="gender" value="male">
                    <span>Male</span>

                    <input type="radio" name="gender" value="female">
                    <span>Female</span>

                    <input type="radio" name="gender" value="other">
                    <span>Other</span>
                </div>
            </div>
            <div class="form-row">
                <label>Date Of Birth :</label>
                <div class="date">
                    <input type="text">
                    <span>-</span>
                    <input type="text">
                    <span>-</span>
                    <input type="text">
                    <small>(dd-mm-yyyy)</small>
                </div>
            </div>
            <div class="form-row">
                <label>Address :</label>
                <input
                    type="text"
                    class="address"
                    placeholder="Street-  House-  Road-"
                >
            </div>
            <div class="form-row">
                <label>Blood Group :</label>
                <select>
                    <option value="">Select</option>
                    <option>A+</option>
                    <option>A-</option>
                    <option>B+</option>
                    <option>B-</option>
                    <option>AB+</option>
                    <option>AB-</option>
                    <option>O+</option>
                    <option>O-</option>
                </select>
            </div>
            <div class="form-row">
                <label>Department :</label>

                <div class="department">
                    <input type="radio" name="department" value="cse">
                    <span>CSE</span>

                    <input type="radio" name="department" value="eee">
                    <span>EEE</span>

                    <input type="radio" name="department" value="bba">
                    <span>BBA</span>
                </div>
            </div>
            <div class="form-row">
                <label>Course :</label>
                <div class="courses">
                    <input type="checkbox" name="course" value="c">
                    <label>C</label>
                    <input type="checkbox" name="course" value="cpp">
                    <label>C++</label>
                    <input type="checkbox" name="course" value="java">
                    <label>Java</label>
                    <input type="checkbox" name="course" value="ai">
                    <label>AI</label>
                    <input type="checkbox" name="course" value="machine-learning">
                    <label>Machine learning</label>
                    <input type="checkbox" name="course" value="robotics">
                    <label>Robotics</label>
                </div>
            </div>
            <div class="form-row photo">
                <label>Photo :</label>
                <input type="file" accept="image/*">
            </div>
            <div class="buttons">
                <input type="submit" value="Submit">
                <input type="reset" value="Reset">
            </div>
    </form>

            <div>
                <a href="../index.html"><button>HOME</button></a>
            </div>

</body>
</html>
